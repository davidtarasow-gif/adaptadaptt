<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Twitch Chat Overlay</title>

  <style>
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: Arial;
    }

    .message {
      color: white;
      font-size: 48px;
      font-weight: 900;
      text-shadow:
        0 0 10px black,
        0 0 20px black;
      margin: 20px;
    }

    .name {
      background: linear-gradient(90deg,#ff00cc,#3333ff,#00ffee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 3s linear infinite;
    }

    @keyframes glow {
      0% { filter:hue-rotate(0deg); }
      100% { filter:hue-rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="message">
  <span class="name">savedatsaint:</span>
  hello twitch
</div>

</body>
</html>
